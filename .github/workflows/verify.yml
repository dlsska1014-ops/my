name: Repository verification

# V22.9.95 R-11: 브랜치 푸시 실행은 PR 의 pull_request 실행과 같은 검사를 되풀이해(PR 당 8번) main 푸시만 돌리고, main 실행은 새 푸시가 와도 취소하지 않는다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        categories: [present, absent]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      AB_QA_CATEGORIES_ABSENT: ${{ matrix.categories == 'absent' && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository verification
        run: node .codex/scripts/verify-repository.mjs
      - name: Verify SQLite monitoring integration
        run: node monitoring/test-d1.mjs
