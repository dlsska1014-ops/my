name: Repository verification

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository verification
        run: node .codex/scripts/verify-repository.mjs
      - name: Verify SQLite monitoring integration
        run: node monitoring/test-d1.mjs
